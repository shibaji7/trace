site_name: Trace Documentation
repo_url: https://github.com/shibaji7/trace
theme: 
  name: "material"
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path

hooks:
    - docs/hooks/inject_last_updated.py

plugins:
    - search
    - glightbox
    - awesome-pages
    - mkdocstrings:
        enabled: !ENV [ENABLE_MKDOCSTRINGS, true]
        default_handler: python
        handlers:
          python:
            paths: [".."]  
            options:
              show_root_heading: true
              show_source: true
              members_order: source
     
markdown_extensions:
    - extra
    - admonition
    - toc
    - tables
    - attr_list
    - toc:
        permalink: true
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.betterem
    - pymdownx.caret
    - pymdownx.mark
    - pymdownx.tilde
    - attr_list
    - md_in_html
    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets:
        check_paths: true
        base_path:
          - .
    - pymdownx.superfences
    - pymdownx.highlight
    - pymdownx.details
    - footnotes
        
extra_javascript:
    - javascripts/mathjax.js
    - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
    - css/pynasonde.css

nav:
    - Home: index.md
    - Installation: user/install.md  
    - Configuration: user/configuration.md
    - Examples:
        - Overview: examples/index.md
        - RT1D NVIS O/X from IRI: examples/rtmodel_nvis_ox_iri_1d.md
        - RT1D O-Mode Appleton vs Sen-Wyller: examples/rtmodel_omode_appleton_sw_demo.md
        - RT1D O-Mode Appleton Absorption (IRI): examples/rtmodel_omode_absorption_appleton_iri_1d.md
        - RT2D IRI Cartesian Oblique Rays: examples/rt2d_iri_cartesian.md
        - RT2D IRI Spherical Oblique Rays: examples/rt2d_iri_spherical.md
        - RT3D IRI Cartesian Ray Trace: examples/rt3d_iri_cartesian.md
        - PHaRLAP + IRI 2D Ray Trace: examples/pharlap_iri.md
        - PHaRLAP + IRI 3D Ray Trace: examples/pharlap_iri_3d.md
    - API:
        - Overview: dev/index.md
        - hfpytrace package:
            - __init__.py: dev/hfpytrace/__init__.md
            - collision.py: dev/hfpytrace/collision.md
            - geomag.py: dev/hfpytrace/geomag.md
            - homing.py: dev/hfpytrace/homing.md
            - pharlap.py: dev/hfpytrace/pharlap.md
            - plottrace.py: dev/hfpytrace/plottrace.md
            - utils.py: dev/hfpytrace/utils.md
            - model subpackage:
                - __init__.py: dev/hfpytrace/model/__init__.md
                - dispersion.py: dev/hfpytrace/model/dispersion.md
                - rt1d.py: dev/hfpytrace/model/rt1d.md
                - rt2d.py: dev/hfpytrace/model/rt2d.md
                - rt3d.py: dev/hfpytrace/model/rt3d.md
            - density subpackage:
                - __init__.py: dev/hfpytrace/density/__init__.md
                - gemini.py: dev/hfpytrace/density/gemini.md
                - gitm.py: dev/hfpytrace/density/gitm.md
                - iri.py: dev/hfpytrace/density/iri.md
                - sami.py: dev/hfpytrace/density/sami.md
                - waccm.py: dev/hfpytrace/density/waccm.md
                - wamipe.py: dev/hfpytrace/density/wamipe.md
    - Citing: user/citing.md
    - Authors: user/authors.md
